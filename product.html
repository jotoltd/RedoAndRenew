<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Redo & Renew by Charline</title>
  <meta name="description" content="One-of-a-kind, hand-finished furniture by Redo & Renew by Charline." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/jpeg" href="assets/img/logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== SIMPLE NAV ===== -->
  <header class="nav scrolled">
    <div class="nav__inner">
      <a href="index.html" class="nav__brand">
        <img src="assets/img/logo.jpg" alt="Redo & Renew by Charline logo" class="nav__logo" />
        <span class="nav__name">Redo & Renew<span class="nav__by"> by Charline</span></span>
      </a>
      <a href="index.html#shop" class="checkout__back">← Back to shop</a>
    </div>
  </header>

  <!-- ===== PRODUCT ===== -->
  <main class="product-page">
    <div class="container product-page__grid" id="productRoot">
      <p class="product-page__loading">Loading piece…</p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <img src="assets/img/logo.jpg" alt="Redo & Renew logo" class="footer__logo" />
        <div>
          <strong>Redo & Renew</strong><span> by Charline</span>
          <p>Bespoke furniture upcycling · Melton Mowbray</p>
        </div>
      </div>
      <p class="footer__tag">Why replace when we can renew? ♻️</p>
      <p class="footer__copy">© <span id="year"></span> Redo & Renew by Charline. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="product.js"></script>
</body>
</html>
