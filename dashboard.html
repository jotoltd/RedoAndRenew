<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Redo & Renew by Charline</title>
  <meta name="description" content="Admin dashboard for Redo & Renew by Charline." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/jpeg" href="assets/img/logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .dashboard { padding: 60px 0 100px; background: var(--cream); min-height: 100vh; }
    .dashboard__header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 40px; flex-wrap: wrap; gap: 16px;
    }
    .dashboard__title { font-family: "Fraunces", serif; font-size: 2rem; color: var(--green-dark); }
    .dashboard__actions { display: flex; gap: 12px; align-items: center; }
    .dashboard__tabs { display: flex; gap: 0; margin-bottom: 30px; border-bottom: 2px solid var(--line); }
    .dashboard__tab {
      padding: 14px 24px; border: none; background: none; cursor: pointer;
      font-family: inherit; font-size: 0.95rem; font-weight: 600;
      color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: all 0.3s var(--ease);
    }
    .dashboard__tab:hover { color: var(--green-dark); }
    .dashboard__tab.active { color: var(--green); border-bottom-color: var(--green); }
    .dashboard__panel { display: none; }
    .dashboard__panel.active { display: block; }

    /* Enquiries */
    .enquiry-card {
      background: var(--white); border-radius: var(--radius);
      padding: 28px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
    }
    .enquiry-card__head {
      display: flex; justify-content: space-between; align-items: start;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
    }
    .enquiry-card__name { font-family: "Fraunces", serif; font-size: 1.3rem; color: var(--green-dark); }
    .enquiry-card__meta { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .enquiry-card__badge {
      display: inline-block; padding: 5px 14px; border-radius: 100px;
      font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .enquiry-card__badge--new { background: #e8f0e9; color: var(--green); }
    .enquiry-card__badge--read { background: #f0eee5; color: var(--muted); }
    .enquiry-card__badge--replied { background: #e9e4f0; color: #6b5b8a; }
    .enquiry-card__details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
    .enquiry-card__detail { font-size: 0.9rem; }
    .enquiry-card__detail strong { color: var(--green-dark); display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
    .enquiry-card__detail span { color: var(--muted); line-height: 1.5; }
    .enquiry-card__photos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .enquiry-card__photos img {
      width: 90px; height: 90px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--line); transition: transform 0.25s;
    }
    .enquiry-card__photos a:hover img { transform: scale(1.05); }
    .enquiry-card__actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .enquiry-card__btn {
      padding: 8px 16px; border-radius: 100px; border: 1.5px solid var(--line);
      background: var(--cream); font-family: inherit; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; color: var(--green-dark); transition: all 0.25s;
    }
    .enquiry-card__btn:hover { border-color: var(--green); background: var(--green); color: var(--cream); }

    /* FAQ editor */
    .faq-editor__item {
      background: var(--white); border-radius: var(--radius);
      padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
    }
    .faq-editor__item input, .faq-editor__item textarea {
      width: 100%; padding: 10px 14px; border: 1.5px solid var(--line);
      border-radius: 8px; font-family: inherit; font-size: 0.92rem;
      margin-bottom: 10px; background: var(--cream);
    }
    .faq-editor__item input:focus, .faq-editor__item textarea:focus {
      outline: none; border-color: var(--green); background: var(--white);
    }
    .faq-editor__item textarea { resize: vertical; min-height: 70px; }
    .faq-editor__actions { display: flex; gap: 10px; }
    .faq-editor__btn {
      padding: 8px 18px; border-radius: 100px; border: none; cursor: pointer;
      font-family: inherit; font-size: 0.82rem; font-weight: 600; transition: all 0.25s;
    }
    .faq-editor__btn--save { background: var(--green); color: var(--cream); }
    .faq-editor__btn--save:hover { background: var(--green-dark); }
    .faq-editor__btn--delete { background: none; border: 1.5px solid #c0392b; color: #c0392b; }
    .faq-editor__btn--delete:hover { background: #c0392b; color: var(--white); }
    .faq-editor__add {
      padding: 12px 28px; border-radius: 100px; border: 2px dashed var(--green);
      background: none; color: var(--green); font-family: inherit; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; transition: all 0.25s; margin-top: 10px;
    }
    .faq-editor__add:hover { background: var(--green); color: var(--cream); }

    .admin-login__note { text-align: center; padding: 60px; color: var(--muted); }

    @media (max-width: 640px) {
      .dashboard { padding: 40px 0 70px; }
      .dashboard__title { font-size: 1.6rem; }
      .dashboard__tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .dashboard__tab { padding: 12px 16px; font-size: 0.85rem; white-space: nowrap; }
      .enquiry-card { padding: 20px; }
      .enquiry-card__details { grid-template-columns: 1fr; }
      .enquiry-card__actions { flex-direction: column; }
      .enquiry-card__btn { width: 100%; }
      .faq-editor__item { padding: 16px; }
    }
  </style>
</head>
<body>

  <main class="dashboard">
    <div class="container">
      <div class="dashboard__header">
        <h1 class="dashboard__title">Dashboard</h1>
        <div class="dashboard__actions">
          <a href="index.html" class="btn btn--ghost" style="padding:10px 22px;font-size:0.88rem;">View site</a>
          <button class="btn btn--ghost" id="logoutBtn" style="padding:10px 22px;font-size:0.88rem;">Log out</button>
        </div>
      </div>

      <div class="dashboard__tabs">
        <button class="dashboard__tab active" data-tab="renew">Renewals</button>
        <button class="dashboard__tab" data-tab="source">Sourcing</button>
        <button class="dashboard__tab" data-tab="other">Other</button>
        <button class="dashboard__tab" data-tab="faq">FAQ Editor</button>
      </div>

      <!-- Enquiries panels -->
      <div class="dashboard__panel active" data-panel="renew">
        <div id="enquiriesRenew">
          <p class="admin-login__note">Loading enquiries…</p>
        </div>
      </div>
      <div class="dashboard__panel" data-panel="source">
        <div id="enquiriesSource">
          <p class="admin-login__note">Loading enquiries…</p>
        </div>
      </div>
      <div class="dashboard__panel" data-panel="other">
        <div id="enquiriesOther">
          <p class="admin-login__note">Loading enquiries…</p>
        </div>
      </div>

      <!-- FAQ panel -->
      <div class="dashboard__panel" data-panel="faq">
        <div id="faqEditor">
          <p class="admin-login__note">Loading FAQ editor…</p>
        </div>
        <button class="faq-editor__add" id="addFaqBtn">+ Add new question</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
