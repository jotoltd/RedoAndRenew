<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Redo & Renew</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/jpeg" href="/assets/img/logo.jpg" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .nf {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--cream); text-align: center; padding: 40px 24px;
    }
    .nf__inner { max-width: 520px; }
    .nf__inner img { width: 72px; height: 72px; object-fit: cover; border-radius: 50%; margin-bottom: 24px; border: 3px solid var(--white); box-shadow: var(--shadow-sm); }
    .nf h1 { font-family: "Fraunces", serif; font-size: clamp(2rem, 5vw, 2.8rem); color: var(--green-dark); margin-bottom: 16px; }
    .nf p { color: var(--muted); line-height: 1.7; margin-bottom: 32px; }
    .nf .btn { margin: 0 6px 10px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__inner">
      <img src="/assets/img/logo.jpg" alt="Redo & Renew logo" />
      <h1>This page has wandered off</h1>
      <p>Like a good piece of furniture, it may have been moved, renewed or rehomed. Let's get you back somewhere useful.</p>
      <a href="/" class="btn btn--primary">Back to home</a>
      <a href="/#shop" class="btn btn--outline">Browse the shop</a>
    </div>
  </main>
</body>
</html>
